
name: Build Bmarket APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project
        run: flutter create . --platforms=android

      - name: Add Internet Permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          content = path.read_text()

          permission = '<uses-permission android:name="android.permission.INTERNET"/>'

          if permission not in content:
              content = content.replace(
                  '<application',
                  permission + '\n    <application',
                  1
              )

          path.write_text(content)
          print("Internet permission berhasil dipasang")
          PY

      - name: Disable problematic Android Lint task
        run: |
          cat >> android/build.gradle <<'EOF'

          subprojects {
              if (project.name == "url_launcher_android") {
                  tasks.matching {
                      it.name == "lintVitalAnalyzeRelease"
                  }.configureEach {
                      enabled = false
                  }
              }
          }
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build Bmarket APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bmarket-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
