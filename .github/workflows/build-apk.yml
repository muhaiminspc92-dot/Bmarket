name: Build Bmarket APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Bmarket
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check project
        run: |
          echo "Checking Flutter project..."
          test -f pubspec.yaml
          flutter --version
          java -version

      - name: Generate Android project
        run: flutter create . --platforms=android

      - name: Configure Android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          content = manifest.read_text()

          permission = (
              '<uses-permission '
              'android:name="android.permission.INTERNET"/>'
          )

          if permission not in content:
              content = content.replace(
                  '<application',
                  permission + '\n    <application',
                  1
              )

          manifest.write_text(content)
          print("Internet permission configured")

          groovy = Path("android/build.gradle")
          kotlin = Path("android/build.gradle.kts")

          lint_config = """
          subprojects {
              tasks.configureEach {
                  if (name == "lintVitalAnalyzeRelease") {
                      enabled = false
                  }
              }
          }
          """

          if groovy.exists():
              with groovy.open("a") as f:
                  f.write("\n" + lint_config)
          elif kotlin.exists():
              with kotlin.open("a") as f:
                  f.write("\n" + lint_config)
          else:
              raise Exception("Android Gradle file not found")

          print("Release lint workaround configured")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Supabase Secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL" || {
            echo "SUPABASE_URL is missing"
            exit 1
          }

          test -n "$SUPABASE_ANON_KEY" || {
            echo "SUPABASE_ANON_KEY is missing"
            exit 1
          }

          echo "Supabase configuration is available"

      - name: Build Bmarket APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Verify APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "APK file was not generated"
            find build -name "*.apk" -type f
            exit 1
          fi

          echo "APK successfully generated"
          ls -lh "$APK"

      - name: Upload Bmarket APK
        uses: actions/upload-artifact@v4
        with:
          name: Bmarket-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
